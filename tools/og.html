<!doctype html>

<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#1E4230}
.og{--fg:#F2EDDC;--bg:#1E4230;--fg-rgb:242,237,220;width:1200px;height:630px;display:grid;grid-template-columns:690px 1fr;align-items:center;padding:0 0 0 72px;box-sizing:border-box;color:#F2EDDC;position:relative}
.og h1{font-family:var(--font-display);font-weight:800;font-size:82px;line-height:.98;letter-spacing:-.03em;margin:18px 0 26px}
.og .four{display:inline-grid;place-items:center;width:1.1em;height:1.1em;border-radius:50%;background:#F2EDDC;color:#1E4230;font-size:.9em}
.og p{font-family:var(--font-text);font-weight:700;font-size:26px;margin:0}
.og .k{font-family:var(--font-display);font-size:18px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.og .nums{display:flex;gap:12px;margin-top:28px}
.og .nums span{border:2px solid #F2EDDC;border-radius:999px;padding:8px 18px;font-family:var(--font-display);font-weight:700;font-size:22px}
.og svg{width:560px;height:auto;margin-left:-60px}
.og .c{position:absolute;bottom:22px;left:72px;font-family:var(--font-text);font-weight:700;font-size:16px;opacity:.85}
.steam{animation:none}
</style></head><body>
